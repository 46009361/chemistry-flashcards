name: Sync to 46009361.com
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source
      - uses: actions/checkout@v4
        with:
          repository: 46009361/46009361.com
          path: target
          token: ${{ secrets.GH_TOKEN }}
      
      - name: Push Auto-Signed Sync Commit
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: "46009361/46009361.com"
          MSG: "${{ github.event.head_commit.message }}"
        run: |
          # 1. Sync the files locally in the runner workspace
          rm -rf target/chemistry-flashcards/
          mkdir -p target/chemistry-flashcards/
          cp -r source/* target/chemistry-flashcards/
          cd target

          # 2. Configure identity properties cleanly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 3. Stage variations and commit them natively on the runner index
          git add chemistry-flashcards/
          git commit -m "$MSG" || true

          # 4. Push directly over HTTPS using token authentication 
          # IMPORTANT: Remove the extra spaces from the URL string below when you paste this
          git push "https://x-access-token:${TOKEN}@github.com/${REPO}.git" main
