name: Sync to 46009361.com

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sync-chemistry-flashcards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      TOKEN: ${{ secrets.GH_TOKEN }}
      TARGET_REPO: 46009361/46009361.com
      TARGET_PREFIX: chemistry-flashcards
      COMMIT_MSG: ${{ github.event.head_commit.message || 'Sync chemistry-flashcards' }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync source files to target repository via GitHub Contents API
        shell: bash
        run: |
          set -euo pipefail

          API_ROOT="https://api.github.com"
          TARGET_API="$API_ROOT/repos/$TARGET_REPO"

          SOURCE_LIST="$(mktemp)"
          TARGET_TREE="$(mktemp)"
          RESPONSE_FILE="$(mktemp)"
          PAYLOAD_FILE="$(mktemp)"
          CONTENT_FILE="$(mktemp)"

          cleanup() {
            rm -f \
              "$SOURCE_LIST" \
              "$TARGET_TREE" \
              "$RESPONSE_FILE" \
              "$PAYLOAD_FILE" \
              "$CONTENT_FILE"
          }
          trap cleanup EXIT

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::GH_TOKEN is not configured."
            exit 1
          fi

          encode_path() {
            local path="$1"
            local encoded=""
            local segment=""

            IFS='/' read -r -a segments <<< "$path"

            for segment in "${segments[@]}"; do
              if [ -n "$encoded" ]; then
                encoded+="/"
              fi
              encoded+="$(printf '%s' "$segment" | jq -sRr @uri)"
            done

            printf '%s' "$encoded"
          }

          echo "Reading target repository metadata..."
          TARGET_BRANCH="$(
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$TARGET_API" |
            jq -er '.default_branch'
          )"

          echo "Target branch: $TARGET_BRANCH"

          echo "Enumerating source files..."
          find . \
            -type f \
            -not -path './.git/*' \
            -not -path './.github/*' \
            -not -path '*/.*' \
            -printf '%P\n' \
            | sort > "$SOURCE_LIST"

          echo "Fetching target repository tree..."
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$TARGET_API/git/trees/$TARGET_BRANCH?recursive=1" \
            > "$TARGET_TREE"

          if jq -e '.truncated == true' "$TARGET_TREE" >/dev/null; then
            echo "::error::Target repository tree response was truncated."
            exit 1
          fi

          while IFS= read -r FILE; do
            [ -n "$FILE" ] || continue
            [ -f "$FILE" ] || continue

            TARGET_PATH="${TARGET_PREFIX}/${FILE}"
            ENCODED_PATH="$(encode_path "$TARGET_PATH")"
            CONTENTS_URL="${TARGET_API}/contents/${ENCODED_PATH}"

            echo "Processing: ${TARGET_PATH}"

            base64 --wrap=0 "$FILE" > "$CONTENT_FILE"

            SHA=""
            HTTP_STATUS="$(
              curl --silent --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$CONTENTS_URL"
            )"

            case "$HTTP_STATUS" in
              200)
                SHA="$(jq -er '.sha' "$RESPONSE_FILE")"
                ;;
              404)
                SHA=""
                ;;
              *)
                echo "::error::Unable to inspect ${TARGET_PATH} (HTTP ${HTTP_STATUS})."
                cat "$RESPONSE_FILE"
                exit 1
                ;;
            esac

            if [ -n "$SHA" ]; then
              jq -n \
                --arg message "$COMMIT_MSG" \
                --arg sha "$SHA" \
                --arg branch "$TARGET_BRANCH" \
                --rawfile content "$CONTENT_FILE" \
                '{
                  message: $message,
                  sha: $sha,
                  branch: $branch,
                  content: $content
                }' > "$PAYLOAD_FILE"
            else
              jq -n \
                --arg message "$COMMIT_MSG" \
                --arg branch "$TARGET_BRANCH" \
                --rawfile content "$CONTENT_FILE" \
                '{
                  message: $message,
                  branch: $branch,
                  content: $content
                }' > "$PAYLOAD_FILE"
            fi

            HTTP_STATUS="$(
              curl --silent --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --request PUT \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                --data-binary "@$PAYLOAD_FILE" \
                "$CONTENTS_URL"
            )"

            case "$HTTP_STATUS" in
              200|201)
                jq -er '.commit.sha' "$RESPONSE_FILE" >/dev/null
                echo "Uploaded: ${TARGET_PATH}"
                ;;
              *)
                echo "::error::GitHub rejected upload for ${TARGET_PATH} (HTTP ${HTTP_STATUS})."
                cat "$RESPONSE_FILE"
                exit 1
                ;;
            esac

          done < "$SOURCE_LIST"

          echo "Removing stale files no longer present in source repo..."
          jq -r \
            --arg prefix "$TARGET_PREFIX" \
            --rawfile source_files "$SOURCE_LIST" '
              ($source_files
                | split("\n")
                | map(select(length > 0) | ($prefix + "/" + .))) as $wanted
              | .tree[]
              | select(.type == "blob")
              | select(.path | startswith($prefix + "/"))
              | .path as $target_path
              | select(($wanted | index($target_path)) == null)
              | [$target_path, .sha]
              | @tsv
            ' "$TARGET_TREE" |
          while IFS=$'\t' read -r TARGET_PATH SHA; do
            [ -n "$TARGET_PATH" ] || continue

            ENCODED_PATH="$(encode_path "$TARGET_PATH")"
            CONTENTS_URL="${TARGET_API}/contents/${ENCODED_PATH}"

            echo "Deleting: ${TARGET_PATH}"

            jq -n \
              --arg message "$COMMIT_MSG" \
              --arg sha "$SHA" \
              --arg branch "$TARGET_BRANCH" \
              '{
                message: $message,
                sha: $sha,
                branch: $branch
              }' > "$PAYLOAD_FILE"

            HTTP_STATUS="$(
              curl --silent --show-error \
                --output "$RESPONSE_FILE" \
                --write-out '%{http_code}' \
                --request DELETE \
                -H "Authorization: Bearer $TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                --data-binary "@$PAYLOAD_FILE" \
                "$CONTENTS_URL"
            )"

            case "$HTTP_STATUS" in
              200|201)
                jq -er '.commit.sha' "$RESPONSE_FILE" >/dev/null
                echo "Deleted: ${TARGET_PATH}"
                ;;
              *)
                echo "::error::GitHub rejected deletion for ${TARGET_PATH} (HTTP ${HTTP_STATUS})."
                cat "$RESPONSE_FILE"
                exit 1
                ;;
            esac
          done

          echo "Synchronization completed successfully."
