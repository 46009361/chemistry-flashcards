name: Sync to 46009361.com
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Files via GitHub Content API (Auto-Signed)
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
          REPO: "46009361/46009361.com"
          COMMIT_MSG: "${{ github.event.head_commit.message }}"
        run: |
          # 1. Dynamically target the exact files present in the repository layout
          # Excluding .github directory files to prevent recursive run conflicts
          FILES=$(find . -type f -not -path '*/.*' -not -path './.github/*' -printf '%P\n')

          echo "$FILES" | while read -r FILE; do
            if [ -n "$FILE" ] && [ -f "$FILE" ]; then
              echo "Processing asset: $FILE"
              
              # 2. Base64 encode the runner's local file content
              CONTENT=$(base64 -w 0 "$FILE")
              
              # 3. Check if the file already exists in the target repo to fetch its SHA blob
              # IMPORTANT: Remove the extra spaces from the URL string below when you paste this
              SHA_RESPONSE=$(curl -s -H "Authorization: token $TOKEN" "https://api.github.com/repos/$REPO/contents/chemistry-flashcards/$FILE")
              SHA=$(echo "$SHA_RESPONSE" | jq -r '.sha // empty')
              
              # 4. Construct the file payload dynamically based on its remote path status
              if [ -n "$SHA" ] && [ "$SHA" != "null" ]; then
                # Target path already exists: include matching remote blob SHA to overwrite
                PAYLOAD=$(jq -n --arg msg "$COMMIT_MSG" --arg content "$CONTENT" --arg sha "$SHA" '{message: $msg, content: $content, sha: $sha}')
              else
                # Completely new file path: omit the blob SHA parameter
                PAYLOAD=$(jq -n --arg msg "$COMMIT_MSG" --arg content "$CONTENT" '{message: $msg, content: $content}')
              fi
              
              # 5. PUT the payload structure to the target workspace via a single-line flat execution path
              # IMPORTANT: Remove the extra spaces from the URL string below when you paste this
              echo "Uploading $FILE over HTTP data stream..."
              curl -s -X PUT -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" -d "$PAYLOAD" "https://api.github.com/repos/$REPO/contents/chemistry-flashcards/$FILE" | jq -r '.commit.sha | "Committed successfully as SHA: \(. // "ERROR")"'
            fi
          done
